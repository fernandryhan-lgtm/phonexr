name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install CMake
      run: brew install cmake

    - name: Build Device Version and Pack
      run: |
        cd PhoneXR-iOS
        
        # 1. Creamos la carpeta de compilación obligatoria para CMake
        mkdir build && cd build
        
        # 2. Forzamos a CMake a configurar el proyecto apuntando a iOS (Dispositivo real)
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../CMakeLists.txt -DCMAKE_BUILD_TYPE=Release
        
        # 3. Compilamos el binario nativo
        make -j$(sysctl -n hw.ncpu)
        
        # 4. Volvemos atrás y ejecutamos el script del desarrollador que empaqueta todo en el IPA
        cd ..
        chmod +x package-livecontainer.sh
        ./package-livecontainer.sh

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneXR-LiveContainer-IPA
        path: PhoneXR-iOS/*.ipa
