name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Assemble App Bundle from Resources
      run: |
        cd PhoneXR-iOS
        
        # 1. Creamos la estructura clásica de un archivo .app de iOS
        mkdir -p Payload/PhoneXR.app
        
        # 2. Copiamos todos los datos, configuraciones e info de la carpeta Resources adentro
        if [ -d "Resources" ]; then
          cp -R Resources/* Payload/PhoneXR.app/
        fi
        
        # 3. Empaquetamos todo en el archivo comprimido .ipa final
        zip -r ../PhoneXR.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneXR-LiveContainer-IPA
        path: PhoneXR.ipa

