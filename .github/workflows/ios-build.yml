name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install CMake
      run: brew install cmake

    - name: Run Developer Package Script
      run: |
        cd PhoneXR-iOS
        chmod +x package-livecontainer.sh
        ./package-livecontainer.sh

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneXR-LiveContainer-IPA
        path: PhoneXR-iOS/*.ipa
