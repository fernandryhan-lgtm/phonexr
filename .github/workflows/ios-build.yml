name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build IPA
      run: |
        cd PhoneXR-iOS
        xcodebuild -project PhoneXR.xcodeproj -scheme PhoneXR -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
        mkdir -p Payload
        mv build/Release-iphoneos/PhoneXR.app Payload/ || mv build/Build/Products/Release-iphoneos/PhoneXR.app Payload/ || true
        zip -r ../PhoneXR.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhoneXR-iOS-IPA
        path: PhoneXR.ipa
